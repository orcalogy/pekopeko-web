openapi: 3.0.3
info:
  title: PekoPeko Restaurant API
  version: v1
  description: >
    Normalized restaurant backend API for the PekoPeko web app and Flutter app.
    This schema is the source of truth for the public /api/v1 contract.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [system]
      responses:
        '200':
          description: API health status
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Runtime capabilities and search contract
      tags: [system]
      responses:
        '200':
          description: API capabilities
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /api/v1/geo/reverse:
    post:
      operationId: reverseGeo
      summary: Resolve country and provider plan from coordinates
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoReverseRequest'
      responses:
        '200':
          description: Geo resolution
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoResolution'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/search:
    post:
      operationId: searchRestaurants
      summary: Search nearby restaurants
      description: >
        First-page requests define the search with location, filters, and optional page size.
        Follow-up requests must send only `pagination.cursor`, which is a signed, short-lived
        continuation token for the stored ordered result set.
      tags: [restaurants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantSearchRequest'
      responses:
        '200':
          description: Search results
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/{restaurantKey}:
    get:
      operationId: getRestaurantDetails
      summary: Get restaurant details by stable restaurant key
      tags: [restaurants]
      parameters:
        - $ref: '#/components/parameters/RestaurantKey'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Restaurant details
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetailsResponse'
              examples:
                live:
                  summary: Fresh details assembled from successful live provider refreshes.
                  value:
                    requestId: 9b5d8a21-1e2d-4483-b457-fcc5a484c4f5
                    restaurant:
                      restaurantKey: rid_live_123
                      name: Good Spoon
                      address: 1-2-3 Shinjuku, Tokyo
                      lat: 35.6905
                      lng: 139.7017
                      rating: 4.3
                      priceLevel: 2
                      isOpenNow: true
                      source: hybrid
                      providerRefs:
                        - provider: google
                          providerId: place-live
                        - provider: hotpepper
                          providerId: J001LIVE
                    freshness:
                      state: live
                    providerStatuses:
                      - provider: hotpepper
                        status: success
                        rawResults: 1
                      - provider: google
                        status: success
                        rawResults: 1
                partialLive:
                  summary: Detail response with some live refresh data and some stale fields.
                  value:
                    requestId: 3ca9ac83-2304-4c9d-81f2-a8e89d5dfe4a
                    restaurant:
                      restaurantKey: rid_partial_123
                      name: Good Spoon
                      address: 1-2-3 Shinjuku, Tokyo
                      lat: 35.6905
                      lng: 139.7017
                      source: hybrid
                      providerRefs:
                        - provider: google
                          providerId: place-partial
                        - provider: hotpepper
                          providerId: J001PARTIAL
                    freshness:
                      state: partial_live
                    providerStatuses:
                      - provider: hotpepper
                        status: success
                        rawResults: 1
                      - provider: google
                        status: failed
                        error:
                          code: upstream_error
                          message: google detail refresh failed
                snapshot:
                  summary: Detail response served entirely from the last stored snapshot.
                  value:
                    requestId: 30ec5a2e-f9a3-4f94-bd6f-3d1ef3aa6b9a
                    restaurant:
                      restaurantKey: rid_snapshot_123
                      name: Good Spoon
                      address: 1-2-3 Shinjuku, Tokyo
                      lat: 35.6905
                      lng: 139.7017
                      source: google
                      providerRefs:
                        - provider: google
                          providerId: place-snapshot
                    freshness:
                      state: snapshot
                    providerStatuses:
                      - provider: google
                        status: failed
                        error:
                          code: upstream_error
                          message: google detail refresh failed
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/{restaurantKey}/photo:
    get:
      operationId: getRestaurantPhoto
      summary: Proxy restaurant photo media
      tags: [restaurants]
      parameters:
        - $ref: '#/components/parameters/RestaurantKey'
        - name: maxWidth
          in: query
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 1600
            default: 800
      responses:
        '200':
          description: Image bytes
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
components:
  headers:
    XRequestId:
      description: Request correlation ID
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds until the client should retry the request.
      schema:
        type: integer
        minimum: 0
    CacheControl:
      description: Applied HTTP cache policy.
      schema:
        type: string
    ContentType:
      description: Actual proxied media type for the image response.
      schema:
        type: string
  parameters:
    RestaurantKey:
      name: restaurantKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Locale:
      name: locale
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AppLocale'
  responses:
    InvalidArgument:
      description: Invalid request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            invalidField:
              summary: Numeric field failed validation.
              value:
                error:
                  code: invalid_argument
                  message: radiusM must be between 100 and 10000
                  requestId: 98a7b135-c933-4d11-a6af-a8efd8a4f3d4
                  details:
                    field: radiusM
            invalidCursor:
              summary: Pagination cursor was malformed or tampered with.
              value:
                error:
                  code: invalid_argument
                  message: pagination.cursor is invalid
                  requestId: 4fbefa7a-a2f3-4c25-bad5-8ed2f23189eb
                  details:
                    field: pagination.cursor
            expiredCursor:
              summary: Pagination cursor expired before the next page was requested.
              value:
                error:
                  code: invalid_argument
                  message: pagination.cursor is invalid
                  requestId: 5d808b65-3864-4cc7-8e45-98baf454d5ff
                  details:
                    field: pagination.cursor
            tamperedCursor:
              summary: Pagination cursor was modified by the client and no longer verifies.
              value:
                error:
                  code: invalid_argument
                  message: pagination.cursor is invalid
                  requestId: 0b3bdf07-d3d8-4477-bf7d-9de4f14e89d9
                  details:
                    field: pagination.cursor
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            movedRestaurant:
              summary: Restaurant key now points to a superseded record.
              value:
                error:
                  code: not_found
                  message: Restaurant has moved
                  requestId: 6d0c1a6e-0952-4f54-9b3e-0b66caedacb3
                  details:
                    restaurantKey: rid_old_123
                    movedToRestaurantKey: rid_new_456
            closedRestaurant:
              summary: Restaurant key points to a permanently closed record.
              value:
                error:
                  code: not_found
                  message: Restaurant is closed
                  requestId: b7d17a05-68dd-42b5-a410-243cb8fb78f5
                  details:
                    restaurantKey: rid_closed_123
                    state: closed
    RateLimited:
      description: >
        Request was rate limited or upstream quota was exhausted. In v1 this primarily reflects
        upstream quota/rate-limit passthrough; local per-IP throttling is not guaranteed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            upstreamQuota:
              summary: Upstream provider asked the client to retry later.
              value:
                error:
                  code: quota_exhausted
                  message: google photo quota exhausted
                  requestId: 1a37dbfd-bd4a-4fd0-ad64-d238caa6ac0d
                  details:
                    provider: google
    ProviderUnavailable:
      description: >
        Required upstream provider is unavailable. In v1 this means the server cannot satisfy the
        request with its current provider configuration, so clients should retry only after server
        configuration changes rather than expecting a transient recovery window.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            providerDown:
              summary: No configured provider could satisfy the request.
              value:
                error:
                  code: provider_unavailable
                  message: hotpepper is unavailable
                  requestId: 75fb2d8f-653f-4275-bcb5-dd1b24f1d6a0
                  details:
                    provider: hotpepper
    UpstreamError:
      description: Upstream provider failure
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    AppLocale:
      type: string
      enum: ['zh-CN', 'ja', 'en']
    ApiVersion:
      type: string
      enum: ['v1']
    ApiErrorCode:
      type: string
      enum:
        - invalid_argument
        - not_found
        - rate_limited
        - provider_unavailable
        - quota_exhausted
        - upstream_error
        - internal
    ProviderKind:
      type: string
      enum: [google, hotpepper, amap]
    ProviderSource:
      type: string
      enum: [google, hotpepper, amap, hybrid]
    ProviderMode:
      type: string
      enum: [auto, google, hotpepper, amap]
      description: >
        Search provider selection mode. `auto` is the recommended default. Explicit non-`auto`
        overrides are supported in v1 for manual control and debugging, but they bypass normal
        region-based provider selection and may return narrower result sets.
    GeoResolutionStrategy:
      type: string
      enum:
        - china_amap
        - hybrid_japan
        - google_global
        - fallback_heuristic
        - manual_override
    GeoResolutionConfidence:
      type: string
      enum: [high, medium, low]
    RestaurantSortBy:
      type: string
      enum: [distance, rating]
    SortDirection:
      type: string
      enum: [asc, desc]
    PaginationMode:
      type: string
      enum: [cursor]
    ProviderOperationStatusState:
      type: string
      enum: [success, failed]
    DetailFreshnessState:
      type: string
      enum: [live, partial_live, snapshot]
      description: >
        Indicates how fresh the detail payload is. `live` means the returned payload was assembled
        from successful live provider refreshes. `partial_live` means at least one live provider
        refresh succeeded but some detail data may still be stale or missing. `snapshot` means no
        live refresh succeeded and the response was served from the last stored snapshot.
    RestaurantFeature:
      type: string
      enum:
        - wifi
        - lunch
        - private_room
        - english
        - non_smoking
        - card
        - parking
    LocalizedCategoryName:
      type: object
      additionalProperties: false
      required: ['zh-CN', ja, en]
      properties:
        zh-CN:
          type: string
        ja:
          type: string
        en:
          type: string
    CategoryCapability:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedCategoryName'
        color:
          type: string
    ProviderConfiguration:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        unsupportedFields:
          type: array
          items:
            type: string
        index:
          type: integer
          minimum: 0
        value:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderKind'
        restaurantKey:
          type: string
        movedToRestaurantKey:
          type: string
        state:
          type: string
          enum: [closed]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          $ref: '#/components/schemas/ApiErrorDetails'
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, time, version]
      properties:
        status:
          type: string
          enum: [ok]
        time:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/ApiVersion'
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [version, locales, providers, geo, details, search, categories]
      properties:
        version:
          $ref: '#/components/schemas/ApiVersion'
        locales:
          type: array
          items:
            $ref: '#/components/schemas/AppLocale'
        providers:
          type: object
          additionalProperties: false
          required: [google, hotpepper, amap]
          properties:
            google:
              $ref: '#/components/schemas/ProviderConfiguration'
            hotpepper:
              $ref: '#/components/schemas/ProviderConfiguration'
            amap:
              $ref: '#/components/schemas/ProviderConfiguration'
        geo:
          type: object
          additionalProperties: false
          required: [strategies, confidences]
          properties:
            strategies:
              type: array
              items:
                $ref: '#/components/schemas/GeoResolutionStrategy'
            confidences:
              type: array
              items:
                $ref: '#/components/schemas/GeoResolutionConfidence'
        details:
          type: object
          additionalProperties: false
          required: [freshnessStates]
          properties:
            freshnessStates:
              type: array
              items:
                $ref: '#/components/schemas/DetailFreshnessState'
        search:
          type: object
          additionalProperties: false
          required:
            - defaultRadiusM
            - minRadiusM
            - maxRadiusM
            - radiusPresetsM
            - defaultPageSize
            - maxPageSize
            - paginationMode
            - providerModes
            - sortBy
            - sortDirections
            - requiredFeatures
          properties:
            defaultRadiusM:
              type: integer
            minRadiusM:
              type: integer
            maxRadiusM:
              type: integer
            radiusPresetsM:
              type: array
              items:
                type: integer
            defaultPageSize:
              type: integer
            maxPageSize:
              type: integer
            paginationMode:
              $ref: '#/components/schemas/PaginationMode'
            providerModes:
              type: array
              items:
                $ref: '#/components/schemas/ProviderMode'
            sortBy:
              type: array
              items:
                $ref: '#/components/schemas/RestaurantSortBy'
            sortDirections:
              type: array
              items:
                $ref: '#/components/schemas/SortDirection'
            requiredFeatures:
              type: array
              items:
                $ref: '#/components/schemas/RestaurantFeature'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCapability'
    GeoReverseRequest:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        locale:
          $ref: '#/components/schemas/AppLocale'
    GeoResolution:
      type: object
      additionalProperties: false
      required: [country, provider, providerPlan, strategy, confidence]
      properties:
        country:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderKind'
        providerPlan:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKind'
        strategy:
          $ref: '#/components/schemas/GeoResolutionStrategy'
        confidence:
          $ref: '#/components/schemas/GeoResolutionConfidence'
    RestaurantProviderRef:
      type: object
      additionalProperties: false
      required: [provider, providerId]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        providerId:
          type: string
    RestaurantSearchItem:
      type: object
      additionalProperties: false
      required:
        - restaurantKey
        - name
        - address
        - lat
        - lng
        - distance
        - source
        - providerRefs
      properties:
        restaurantKey:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        distance:
          type: integer
        rating:
          type: number
          format: double
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        isOpenNow:
          type: boolean
        openingHours:
          type: array
          items:
            type: string
        cuisineType:
          type: string
        photoUrl:
          type: string
        phone:
          type: string
        placeUrl:
          type: string
        detailUrl:
          type: string
        couponUrl:
          type: string
        accessInfo:
          type: string
        budgetText:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        menuUrl:
          type: string
        websiteUrl:
          type: string
        source:
          $ref: '#/components/schemas/ProviderSource'
        providerRefs:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantProviderRef'
    RestaurantDetailsResource:
      type: object
      additionalProperties: false
      required:
        - restaurantKey
        - name
        - address
        - lat
        - lng
        - source
        - providerRefs
      properties:
        restaurantKey:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: double
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        isOpenNow:
          type: boolean
        openingHours:
          type: array
          items:
            type: string
        cuisineType:
          type: string
        photoUrl:
          type: string
        phone:
          type: string
        placeUrl:
          type: string
        detailUrl:
          type: string
        couponUrl:
          type: string
        accessInfo:
          type: string
        budgetText:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        menuUrl:
          type: string
        websiteUrl:
          type: string
        source:
          $ref: '#/components/schemas/ProviderSource'
        providerRefs:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantProviderRef'
    RestaurantSearchQuery:
      type: object
      additionalProperties: false
      properties:
        keyword:
          type: string
        categoryId:
          type: string
        providerKeywords:
          type: object
          additionalProperties: false
          description: >
            Optional bounded provider-specific keyword expansion. Clients should send these only as
            a supplement to the base keyword when a semantic parser has high enough confidence that
            extra provider terms may improve recall. The server may ignore these terms when the
            base search already has enough results.
          properties:
            google:
              type: array
              maxItems: 3
              items:
                type: string
            hotpepper:
              type: array
              maxItems: 3
              items:
                type: string
            amap:
              type: array
              maxItems: 3
              items:
                type: string
    RestaurantSearchFilters:
      type: object
      additionalProperties: false
      properties:
        openNow:
          type: boolean
        minRating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        maxPriceLevel:
          type: integer
          minimum: 0
          maximum: 4
        partySize:
          type: integer
          minimum: 1
          maximum: 50
        requiredFeatures:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
    RestaurantSearchSort:
      type: object
      additionalProperties: false
      properties:
        by:
          $ref: '#/components/schemas/RestaurantSortBy'
        direction:
          $ref: '#/components/schemas/SortDirection'
    RestaurantSearchPaginationRequest:
      type: object
      additionalProperties: false
      description: >
        Cursor-based pagination. `pageSize` may be set only on the first page. When `cursor` is
        present, omit all other search-definition fields and continue the previously created search
        session.
      properties:
        pageSize:
          type: integer
          minimum: 1
          maximum: 40
          description: Allowed only on first-page requests when `pagination.cursor` is omitted.
        cursor:
          type: string
          description: >
            Signed, short-lived continuation token returned by the previous page. When this field
            is present, do not send `locale`, `provider`, `location`, `radiusM`, `query`,
            `filters`, `sort`, or `pagination.pageSize`.
    RestaurantSearchRequest:
      type: object
      additionalProperties: false
      description: >
        First-page requests define the search. Follow-up requests must use only
        `pagination.cursor` and may not redefine the search.
      properties:
        locale:
          $ref: '#/components/schemas/AppLocale'
        provider:
          $ref: '#/components/schemas/ProviderMode'
        location:
          type: object
          additionalProperties: false
          description: Required when pagination.cursor is omitted.
          required: [lat, lng]
          properties:
            lat:
              type: number
              format: double
              minimum: -90
              maximum: 90
            lng:
              type: number
              format: double
              minimum: -180
              maximum: 180
        radiusM:
          type: integer
          minimum: 100
          maximum: 10000
        query:
          $ref: '#/components/schemas/RestaurantSearchQuery'
        filters:
          $ref: '#/components/schemas/RestaurantSearchFilters'
        sort:
          $ref: '#/components/schemas/RestaurantSearchSort'
        pagination:
          $ref: '#/components/schemas/RestaurantSearchPaginationRequest'
    AppliedRestaurantFilters:
      type: object
      additionalProperties: false
      required: [openNow, requiredFeatures, sortBy, sortDirection]
      properties:
        openNow:
          type: boolean
        minRating:
          type: number
          format: double
        maxPriceLevel:
          type: integer
        partySize:
          type: integer
        requiredFeatures:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        sortBy:
          $ref: '#/components/schemas/RestaurantSortBy'
        sortDirection:
          $ref: '#/components/schemas/SortDirection'
    UpstreamErrorInfo:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
    ProviderOperationStatus:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        status:
          $ref: '#/components/schemas/ProviderOperationStatusState'
        rawResults:
          type: integer
        error:
          $ref: '#/components/schemas/UpstreamErrorInfo'
    RestaurantSearchPagination:
      type: object
      additionalProperties: false
      required: [mode, pageSize, returned, total]
      properties:
        mode:
          $ref: '#/components/schemas/PaginationMode'
        pageSize:
          type: integer
        nextCursor:
          type: string
          nullable: true
        returned:
          type: integer
        total:
          type: integer
    RestaurantSearchResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - resolved
        - appliedFilters
        - partialResults
        - providerStatuses
        - results
        - pagination
      properties:
        requestId:
          type: string
          format: uuid
        resolved:
          $ref: '#/components/schemas/GeoResolution'
        appliedFilters:
          $ref: '#/components/schemas/AppliedRestaurantFilters'
        partialResults:
          type: boolean
        providerStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperationStatus'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantSearchItem'
        pagination:
          $ref: '#/components/schemas/RestaurantSearchPagination'
    RestaurantDetailsFreshness:
      type: object
      additionalProperties: false
      required: [state]
      description: >
        Freshness metadata for the detail payload. `snapshot` responses may contain stale registry
        data and should not be cached beyond the immediate response.
      properties:
        state:
          $ref: '#/components/schemas/DetailFreshnessState'
    RestaurantDetailsResponse:
      type: object
      additionalProperties: false
      required: [requestId, restaurant, freshness, providerStatuses]
      properties:
        requestId:
          type: string
          format: uuid
        restaurant:
          $ref: '#/components/schemas/RestaurantDetailsResource'
        freshness:
          $ref: '#/components/schemas/RestaurantDetailsFreshness'
        providerStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperationStatus'
