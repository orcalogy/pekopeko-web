openapi: 3.0.3
info:
  title: PekoPeko Restaurant API
  version: v1
  description: >
    Normalized restaurant backend API for the PekoPeko web app and Flutter app.
    This schema is the source of truth for the public /api/v1 contract.
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [system]
      responses:
        '200':
          description: API health status
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Runtime capabilities and search contract
      tags: [system]
      responses:
        '200':
          description: API capabilities
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /api/v1/geo/reverse:
    post:
      operationId: reverseGeo
      summary: Resolve country and provider plan from coordinates
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoReverseRequest'
      responses:
        '200':
          description: Geo resolution
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoResolution'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/search:
    post:
      operationId: searchRestaurants
      summary: Search nearby restaurants
      tags: [restaurants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantSearchRequest'
      responses:
        '200':
          description: Search results
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantSearchResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/{restaurantKey}:
    get:
      operationId: getRestaurantDetails
      summary: Get restaurant details by stable restaurant key
      tags: [restaurants]
      parameters:
        - $ref: '#/components/parameters/RestaurantKey'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Restaurant details
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetailsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/v1/restaurants/{restaurantKey}/photo:
    get:
      operationId: getRestaurantPhoto
      summary: Proxy restaurant photo media
      tags: [restaurants]
      parameters:
        - $ref: '#/components/parameters/RestaurantKey'
        - name: maxWidth
          in: query
          required: false
          schema:
            type: integer
            minimum: 100
            maximum: 1600
            default: 800
      responses:
        '200':
          description: Image bytes
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Content-Type:
              $ref: '#/components/headers/ContentType'
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        default:
          $ref: '#/components/responses/InternalError'
components:
  headers:
    XRequestId:
      description: Request correlation ID
      schema:
        type: string
        format: uuid
    RetryAfter:
      description: Seconds until the client should retry the request.
      schema:
        type: integer
        minimum: 0
    CacheControl:
      description: Applied HTTP cache policy.
      schema:
        type: string
    ContentType:
      description: Actual proxied media type for the image response.
      schema:
        type: string
  parameters:
    RestaurantKey:
      name: restaurantKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Locale:
      name: locale
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AppLocale'
  responses:
    InvalidArgument:
      description: Invalid request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    RateLimited:
      description: Request was rate limited or upstream quota was exhausted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ProviderUnavailable:
      description: Required upstream provider is unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    UpstreamError:
      description: Upstream provider failure
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    InternalError:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    AppLocale:
      type: string
      enum: ['zh-CN', 'ja', 'en']
    ApiVersion:
      type: string
      enum: ['v1']
    ApiErrorCode:
      type: string
      enum:
        - invalid_argument
        - not_found
        - rate_limited
        - provider_unavailable
        - quota_exhausted
        - upstream_error
        - internal
    ProviderKind:
      type: string
      enum: [google, hotpepper, amap]
    ProviderSource:
      type: string
      enum: [google, hotpepper, amap, hybrid]
    ProviderMode:
      type: string
      enum: [auto, google, hotpepper, amap]
    GeoResolutionStrategy:
      type: string
      enum:
        - china_amap
        - hybrid_japan
        - google_global
        - fallback_heuristic
        - manual_override
    GeoResolutionConfidence:
      type: string
      enum: [high, medium, low]
    RestaurantSortBy:
      type: string
      enum: [distance, rating]
    SortDirection:
      type: string
      enum: [asc, desc]
    PaginationMode:
      type: string
      enum: [cursor]
    ProviderOperationStatusState:
      type: string
      enum: [success, failed]
    DetailFreshnessState:
      type: string
      enum: [live, partial_live, snapshot]
    RestaurantFeature:
      type: string
      enum:
        - wifi
        - lunch
        - private_room
        - english
        - non_smoking
        - card
        - parking
    LocalizedCategoryName:
      type: object
      additionalProperties: false
      required: ['zh-CN', ja, en]
      properties:
        zh-CN:
          type: string
        ja:
          type: string
        en:
          type: string
    CategoryCapability:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedCategoryName'
        color:
          type: string
    ProviderConfiguration:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
    ApiErrorDetails:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        unsupportedFields:
          type: array
          items:
            type: string
        index:
          type: integer
          minimum: 0
        value:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderKind'
        restaurantKey:
          type: string
        movedToRestaurantKey:
          type: string
        state:
          type: string
          enum: [closed]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          $ref: '#/components/schemas/ApiErrorDetails'
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, time, version]
      properties:
        status:
          type: string
          enum: [ok]
        time:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/ApiVersion'
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [version, locales, providers, geo, search, categories]
      properties:
        version:
          $ref: '#/components/schemas/ApiVersion'
        locales:
          type: array
          items:
            $ref: '#/components/schemas/AppLocale'
        providers:
          type: object
          additionalProperties: false
          required: [google, hotpepper, amap]
          properties:
            google:
              $ref: '#/components/schemas/ProviderConfiguration'
            hotpepper:
              $ref: '#/components/schemas/ProviderConfiguration'
            amap:
              $ref: '#/components/schemas/ProviderConfiguration'
        geo:
          type: object
          additionalProperties: false
          required: [strategies, confidences]
          properties:
            strategies:
              type: array
              items:
                $ref: '#/components/schemas/GeoResolutionStrategy'
            confidences:
              type: array
              items:
                $ref: '#/components/schemas/GeoResolutionConfidence'
        search:
          type: object
          additionalProperties: false
          required:
            - defaultRadiusM
            - minRadiusM
            - maxRadiusM
            - radiusPresetsM
            - defaultPageSize
            - maxPageSize
            - paginationMode
            - providerModes
            - sortBy
            - sortDirections
            - requiredFeatures
          properties:
            defaultRadiusM:
              type: integer
            minRadiusM:
              type: integer
            maxRadiusM:
              type: integer
            radiusPresetsM:
              type: array
              items:
                type: integer
            defaultPageSize:
              type: integer
            maxPageSize:
              type: integer
            paginationMode:
              $ref: '#/components/schemas/PaginationMode'
            providerModes:
              type: array
              items:
                $ref: '#/components/schemas/ProviderMode'
            sortBy:
              type: array
              items:
                $ref: '#/components/schemas/RestaurantSortBy'
            sortDirections:
              type: array
              items:
                $ref: '#/components/schemas/SortDirection'
            requiredFeatures:
              type: array
              items:
                $ref: '#/components/schemas/RestaurantFeature'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCapability'
    GeoReverseRequest:
      type: object
      additionalProperties: false
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        locale:
          $ref: '#/components/schemas/AppLocale'
    GeoResolution:
      type: object
      additionalProperties: false
      required: [country, provider, providerPlan, strategy, confidence]
      properties:
        country:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderKind'
        providerPlan:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKind'
        strategy:
          $ref: '#/components/schemas/GeoResolutionStrategy'
        confidence:
          $ref: '#/components/schemas/GeoResolutionConfidence'
    RestaurantProviderRef:
      type: object
      additionalProperties: false
      required: [provider, providerId]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        providerId:
          type: string
    RestaurantSearchItem:
      type: object
      additionalProperties: false
      required:
        - restaurantKey
        - name
        - address
        - lat
        - lng
        - distance
        - source
        - providerRefs
      properties:
        restaurantKey:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        distance:
          type: integer
        rating:
          type: number
          format: double
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        isOpenNow:
          type: boolean
        openingHours:
          type: array
          items:
            type: string
        cuisineType:
          type: string
        photoUrl:
          type: string
        phone:
          type: string
        placeUrl:
          type: string
        detailUrl:
          type: string
        couponUrl:
          type: string
        accessInfo:
          type: string
        budgetText:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        menuUrl:
          type: string
        websiteUrl:
          type: string
        source:
          $ref: '#/components/schemas/ProviderSource'
        providerRefs:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantProviderRef'
    RestaurantDetailsResource:
      type: object
      additionalProperties: false
      required:
        - restaurantKey
        - name
        - address
        - lat
        - lng
        - source
        - providerRefs
      properties:
        restaurantKey:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: double
        priceLevel:
          type: integer
          minimum: 0
          maximum: 4
        isOpenNow:
          type: boolean
        openingHours:
          type: array
          items:
            type: string
        cuisineType:
          type: string
        photoUrl:
          type: string
        phone:
          type: string
        placeUrl:
          type: string
        detailUrl:
          type: string
        couponUrl:
          type: string
        accessInfo:
          type: string
        budgetText:
          type: string
        capacity:
          type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        menuUrl:
          type: string
        websiteUrl:
          type: string
        source:
          $ref: '#/components/schemas/ProviderSource'
        providerRefs:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantProviderRef'
    RestaurantSearchQuery:
      type: object
      additionalProperties: false
      properties:
        keyword:
          type: string
        categoryId:
          type: string
    RestaurantSearchFilters:
      type: object
      additionalProperties: false
      properties:
        openNow:
          type: boolean
        minRating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        maxPriceLevel:
          type: integer
          minimum: 0
          maximum: 4
        partySize:
          type: integer
          minimum: 1
          maximum: 50
        requiredFeatures:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
    RestaurantSearchSort:
      type: object
      additionalProperties: false
      properties:
        by:
          $ref: '#/components/schemas/RestaurantSortBy'
        direction:
          $ref: '#/components/schemas/SortDirection'
    RestaurantSearchPaginationRequest:
      type: object
      additionalProperties: false
      properties:
        pageSize:
          type: integer
          minimum: 1
          maximum: 40
        cursor:
          type: string
    RestaurantSearchRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/AppLocale'
        provider:
          $ref: '#/components/schemas/ProviderMode'
        location:
          type: object
          additionalProperties: false
          description: Required when pagination.cursor is omitted.
          required: [lat, lng]
          properties:
            lat:
              type: number
              format: double
              minimum: -90
              maximum: 90
            lng:
              type: number
              format: double
              minimum: -180
              maximum: 180
        radiusM:
          type: integer
          minimum: 100
          maximum: 10000
        query:
          $ref: '#/components/schemas/RestaurantSearchQuery'
        filters:
          $ref: '#/components/schemas/RestaurantSearchFilters'
        sort:
          $ref: '#/components/schemas/RestaurantSearchSort'
        pagination:
          $ref: '#/components/schemas/RestaurantSearchPaginationRequest'
    AppliedRestaurantFilters:
      type: object
      additionalProperties: false
      required: [openNow, requiredFeatures, sortBy, sortDirection]
      properties:
        openNow:
          type: boolean
        minRating:
          type: number
          format: double
        maxPriceLevel:
          type: integer
        partySize:
          type: integer
        requiredFeatures:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantFeature'
        sortBy:
          $ref: '#/components/schemas/RestaurantSortBy'
        sortDirection:
          $ref: '#/components/schemas/SortDirection'
    UpstreamErrorInfo:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
    ProviderOperationStatus:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKind'
        status:
          $ref: '#/components/schemas/ProviderOperationStatusState'
        rawResults:
          type: integer
        error:
          $ref: '#/components/schemas/UpstreamErrorInfo'
    RestaurantSearchPagination:
      type: object
      additionalProperties: false
      required: [mode, pageSize, returned, total]
      properties:
        mode:
          $ref: '#/components/schemas/PaginationMode'
        pageSize:
          type: integer
        nextCursor:
          type: string
          nullable: true
        returned:
          type: integer
        total:
          type: integer
    RestaurantSearchResponse:
      type: object
      additionalProperties: false
      required:
        - requestId
        - resolved
        - appliedFilters
        - partialResults
        - providerStatuses
        - results
        - pagination
      properties:
        requestId:
          type: string
          format: uuid
        resolved:
          $ref: '#/components/schemas/GeoResolution'
        appliedFilters:
          $ref: '#/components/schemas/AppliedRestaurantFilters'
        partialResults:
          type: boolean
        providerStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperationStatus'
        results:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantSearchItem'
        pagination:
          $ref: '#/components/schemas/RestaurantSearchPagination'
    RestaurantDetailsFreshness:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/DetailFreshnessState'
    RestaurantDetailsResponse:
      type: object
      additionalProperties: false
      required: [requestId, restaurant, freshness, providerStatuses]
      properties:
        requestId:
          type: string
          format: uuid
        restaurant:
          $ref: '#/components/schemas/RestaurantDetailsResource'
        freshness:
          $ref: '#/components/schemas/RestaurantDetailsFreshness'
        providerStatuses:
          type: array
          items:
            $ref: '#/components/schemas/ProviderOperationStatus'
